services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # MySQL runs on the host machine, not inside Docker
      DB_HOST: host.docker.internal
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend
